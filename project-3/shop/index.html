<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="../styles.css" type="text/css" rel="stylesheet" />
    <script type="module" src="../auth-check.js"></script>
    <script src="./script.js"></script>
    <title>RYUG Shop</title>
  </head>

  <body>
    <ryug-navbar> </ryug-navbar>
    <main class="overflow-hidden my-[1rem] max-w-[1200px] mx-auto p-[1rem]">
      <div class="my-[2rem]">
        <h3>Checkout what we have in stock!</h3>
        <p>We have plethora of items to choose from...</p>
      </div>
      <form>
        <div class="flex gap-[.5rem]">
          <div class="flex items-center relative w-full">
            <label for="shop-search">Search</label>
            <input id="shop-search" name="serch" type="search" />
          </div>
          <select name="sort">
            <option value="">Default</option>
            <option value="title">Title</option>
            <option value="description">Description</option>
            <option value="condition">Condition</option>
            <option value="price">Price</option>
          </select>
          <button class="bg-blue-500">Go</button>
        </div>
      </form>
      <div class="overflow-auto">
        <table class="m-auto mt-[1rem] mb-[5rem] w-full">
          <caption class="bg-cyan-600 text-white p-[.5rem]">
            Shop
          </caption>
          <thead>
            <tr class="">
              <th>Title</th>
              <th>Description</th>
              <th>Condition</th>
              <th>Price</th>
            </tr>
          </thead>
          <tbody class="overflow-scroll">
            <tr
              is="ryug-shop-item"
              title="The Emotionally Conflicted Vase"
              description="A vase that can’t decide whether it’s modern art or a melted candle."
              condition="Questionably stable"
              price="12.99"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Screaming Sunflower Lamp"
              description="Its expression says “Please turn me off,” but its brightness says otherwise."
              condition="Loud"
              price="19.99"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Hand-Knitted Sweater for Unknown Creature"
              description="Too small for a person, too big for a cat. Who is this for? You decide."
              condition="Philosophically confusing"
              price="9.49"
            ></tr>
            <tr
              is="The Haunted Sandwich Toaster"
              title="The Emotionally Conflicted Vase"
              description="Makes grilled cheese… sometimes screams."
              condition="Works on even-numbered days"
              price="24.00"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="DIY Clock with No Numbers"
              description="Time is a social construct; guessing is part of the fun."
              condition="Conceptually functional"
              price="7.77"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Decorative Rock With Eyes"
              description="Watches you while you sleep."
              condition="Alive?"
              price="4.26"
            ></tr>

            <tr
              is="ryug-shop-item"
              title="Vintage Porcelain Clown Nightlight"
              description="Glows softly while maintaining unblinking eye contact from any angle."
              condition="Emotionally unsettling"
              price="13.37"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="World’s Saddest Coffee Mug"
              description="Printed with a motivational quote that even the mug doesn’t believe."
              condition="Stained with broken dreams"
              price="5.49"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Crocheted Toilet Seat Cozy"
              description="Because nothing says luxury like a knit surprise in the bathroom."
              condition="Lightly cursed"
              price="8.25"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Ceramic Cat With Human Hands"
              description="No one knows why it was made. No one knows why it has thumbs."
              condition="Too detailed"
              price="17.89"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Inspirational Rock With Typos"
              description="Engraved with the words “Belive in Yorself” in permanent shame."
              condition="Unfixably inspirational"
              price="3.33"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Glow-in-the-Dark Fork Set"
              description="Perfect for midnight snacking and accidentally summoning aliens."
              condition="Radioactively optimistic"
              price="10.04"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Musical Birthday Hat"
              description="Plays ‘Happy Birthday’ off-key every time you move your head."
              condition="Sonically aggressive"
              price="9.99"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Abstract Horse Painting (Probably)"
              description="Could be a horse. Could be a cloud. Could be tax fraud. You decide."
              condition="Existential"
              price="21.50"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Mismatched Salt and Pepper Shakers"
              description="One is a penguin, the other is a pineapple. Together, unstoppable."
              condition="Socially incompatible"
              price="6.66"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Holiday Sweater That Plays Jingles"
              description="Randomly blasts 3 different holiday songs, none in the right season."
              condition="Seasonally confused"
              price="18.24"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Self-Help Book for Plants"
              description="Includes chapters like “You Deserve Sunlight” and “Root For Yourself.”"
              condition="Unread, by plants and humans"
              price="7.05"
            ></tr>
            <tr
              is="ryug-shop-item"
              title="Decorative Plate of Unknown Celebrity"
              description="You don’t know them. We don’t know them. Someone’s grandma probably did."
              condition="Lovingly collected, by accident"
              price="14.32"
            ></tr>
          </tbody>
        </table>
      </div>
    </main>
    <ryug-footer></ryug-footer>
    <script type="module" src="../components/navbar.js"></script>
    <script type="module" src="../components/footer.js"></script>
    <script type="module" src="../components/shop-item.js"></script>
  </body>
</html>
